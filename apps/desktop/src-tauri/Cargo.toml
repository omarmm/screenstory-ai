[package]
name = "screenstory"
version = "0.2.0"
description = "Turn screen recordings into clear tutorials."
authors = ["Screenstory Contributors"]
edition = "2021"

[lib]
name = "screenstory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
