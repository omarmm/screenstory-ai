name: Desktop CI

permissions:
  contents: write

on:
  push:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Verify Tauri-relative production assets
        run: |
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Production assets must use relative paths for the Tauri app URL" >&2
            exit 1
          fi

  linux-deb:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install renderer proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
          ffmpeg -hide_banner -h filter=drawtext 2>&1 | grep -q text_shaping
          fc-match -f '%{file}\n' 'sans:lang=ar' | grep -q .
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Apply and commit Rust formatting
        run: |
          cargo fmt --all
          if ! git diff --quiet -- apps/desktop/src-tauri/src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/src-tauri/src
            git commit -m "style: apply rustfmt to desktop native code"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test
      - name: Rust lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile
      - name: Build Debian package
        working-directory: apps/desktop
        run: pnpm tauri build --bundles deb
      - name: Verify Debian package metadata
        working-directory: apps/desktop/src-tauri
        run: |
          package="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          echo "Package: $(dpkg-deb -f "$package" Package)"
          echo "Version: $(dpkg-deb -f "$package" Version)"
          echo "Architecture: $(dpkg-deb -f "$package" Architecture)"
          echo "Dependencies: $(dpkg-deb -f "$package" Depends)"
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: screenstory-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
