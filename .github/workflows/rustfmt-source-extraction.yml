name: Rustfmt source extraction

on:
  push:
    branches:
      - prototype/tauri-foundation
    paths:
      - "apps/desktop/src-tauri/src/lib.rs"
      - "apps/desktop/src-tauri/Cargo.toml"

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Upload formatted Rust source
        uses: actions/upload-artifact@v4
        with:
          name: screenstory-rustfmt-source
          path: apps/desktop/src-tauri/src/lib.rs
          if-no-files-found: error
