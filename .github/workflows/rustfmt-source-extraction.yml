name: Rustfmt source extraction

on:
  push:
    branches:
      - prototype/tauri-foundation
    paths:
      - "apps/desktop/src-tauri/src/lib.rs"
      - "apps/desktop/src-tauri/Cargo.toml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Remove temporary workflow trigger
        run: |
          sed -i '/Temporary rustfmt extraction trigger/d' apps/desktop/src-tauri/src/lib.rs
          sed -i '/Trigger rustfmt automation/d' apps/desktop/src-tauri/src/lib.rs
          rm .github/workflows/rustfmt-source-extraction.yml
      - name: Commit formatted sources and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs
          git add -u .github/workflows/rustfmt-source-extraction.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(rust): apply rustfmt and remove temporary bootstrap workflow"
            git push origin HEAD:prototype/tauri-foundation
          fi
